<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mut:#5d6b78;--line:#d8dee4;--acc:#0f5c7a;--acc2:#dcecf2;--bad:#b3392b;--ok:#1d7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#182430;--ink:#e6edf3;--mut:#93a3b1;--line:#2a3a48;--acc:#5bb6d6;--acc2:#1c3542;--bad:#ff8a78;--ok:#5fd394}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#182430;--ink:#e6edf3;--mut:#93a3b1;--line:#2a3a48;--acc:#5bb6d6;--acc2:#1c3542;--bad:#ff8a78;--ok:#5fd394}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:4px 0 12px;font-weight:650}
h2{font-size:16px;margin:24px 0 8px;font-weight:650}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.total{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{font-variant-numeric:tabular-nums;font-weight:650}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.bar{height:10px;background:var(--acc2);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.over i{background:var(--bad)}
.tg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.tg .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tg .bar{height:16px;border-radius:8px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:10px;background:var(--card);color:var(--ink);border:0;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.btn{margin-top:16px;width:100%;padding:12px;background:var(--acc);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:650;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;padding:0 4px}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:14px}.chk input{width:auto}
textarea{width:100%;height:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:12px monospace}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{color:var(--mut);padding:16px 0}
</style>
</head>
<body>
<div class="w">
<h1>Catatan Keuangan</h1>
<nav id="nav"></nav>
<div id="warn" class="mut neg"></div>
<main id="v"></main>
</div>
<script>
const KEY='keuangan_v1';
const OUT0=['Makan','BBM','Air minum','Langganan kerja','Internet','Kiriman orang tua','Lainnya'];
const INC0=['Gaji','Lainnya'];
const TABS=[['ring','Ringkasan'],['catat','Catat'],['riw','Riwayat'],['tgt','Target'],['atur','Atur']];
let mode='bln',OUT,INC,S,tab='ring',ttype='out',month=new Date().toISOString().slice(0,7);
function def(){const d=new Date();d.setMonth(d.getMonth()+3);return{
wallets:[{id:'r1',name:'Rekening 1 (kas harian)'},{id:'r2t',name:'Rekening 2 - tabungan'},{id:'r2b',name:'Rekening 2 - biasa'},{id:'r3',name:'Rekening 3 (dana darurat)'},{id:'dd',name:'Dompet digital'},{id:'em',name:'Emas digital'},{id:'cash',name:'Cash'}],
tx:[],targets:[{id:'t1',name:'Tabungan 3 bulan',amt:11400000,wallets:['r2t','em'],deadline:d.toISOString().slice(0,10)}],
budgets:{'Makan':1290000,'BBM':430000,'Air minum':35000,'Langganan kerja':500000,'Internet':150000,'Kiriman orang tua':500000,'Lainnya':0},open:{},wbud:{},catsOut:OUT0.slice(),catsIn:INC0.slice()}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):null}catch(e){S=null}if(!S)S=def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('warn').textContent=''}catch(e){document.getElementById('warn').textContent='Data tidak bisa disimpan di browser ini. Gunakan cadangan di tab Target.'}}
const $=id=>document.getElementById(id);
const P=v=>+String(v).replace(/\D/g,'')||0;
function fm(el){const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');el.value=d?(+d).toLocaleString('id-ID'):''}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp '+Math.abs(Math.round(n)).toLocaleString('id-ID');
const wn=id=>(S.wallets.find(w=>w.id===id)||{name:'?'}).name;
function bal(id){return S.tx.reduce((a,t)=>{if(t.type==='in'&&t.wallet===id)a+=t.amt;else if(t.type==='out'&&t.wallet===id)a-=t.amt;else if(t.type==='tf'){if(t.wallet===id)a-=t.amt;if(t.to===id)a+=t.amt}return a},S.open[id]||0)}
function bars(rows){return rows.map(([n,v,lim])=>{const p=lim>0?Math.min(100,v/lim*100):0,over=lim>0&&v>lim;
const st=lim>0?(over?`<span class="neg">Lebih ${rp(v-lim)}</span>`:`<span class="pos">Sisa ${rp(lim-v)}</span>`):'<span class="mut">Belum ada anggaran</span>';
return`<div style="margin:12px 0"><div class="row" style="border:0;padding:0"><span>${esc(n)}</span><b class="${over?'neg':''}">${rp(v)}${lim>0?' / '+rp(lim):''}</b></div><div class="bar ${over?'over':''}"><i style="width:${p}%"></i></div><div style="font-size:13px">${st}</div></div>`}).join('')}
function per(){
if(mode==='bln')return{tx:S.tx.filter(t=>t.date.startsWith(month)),k:1};
const e=month+'-31',tx=S.tx.filter(t=>t.date<=e);
const f=tx.length?tx.reduce((a,t)=>t.date<a?t.date:a,e).slice(0,7):month;
const k=Math.max(1,(+month.slice(0,4)-+f.slice(0,4))*12+(+month.slice(5,7)-+f.slice(5,7))+1);
return{tx,k}}
function ring(){
const tot=S.wallets.reduce((a,w)=>a+bal(w.id),0);
const {tx:m,k}=per();
const inc=m.filter(t=>t.type==='in'&&t.cat!=='Saldo awal').reduce((a,t)=>a+t.amt,0);
const sp={},sw={};m.filter(t=>t.type==='out').forEach(t=>{sp[t.cat]=(sp[t.cat]||0)+t.amt;sw[t.wallet]=(sw[t.wallet]||0)+t.amt});
const out=Object.values(sp).reduce((a,b)=>a+b,0);
const cr=OUT.map(c=>[c,sp[c]||0,(S.budgets[c]||0)*k]);
const wr=S.wallets.map(w=>[w.name,sw[w.id]||0,(S.wbud[w.id]||0)*k]);
const over=cr.reduce((a,[,v,l])=>a+(l>0&&v>l?v-l:0),0),left=cr.reduce((a,[,v,l])=>a+(l>0&&v<l?l-v:0),0);
return`<div class="mut">Total semua wadah</div><div class="total">${rp(tot)}</div>
<h2>Saldo per wadah</h2>${S.wallets.map(w=>`<div class="row"><span>${esc(w.name)}</span><b class="${bal(w.id)<0?'neg':''}">${rp(bal(w.id))}</b></div>`).join('')}
<h2>Periode</h2>
<div class="seg" role="group" aria-label="Mode periode"><button class="${mode==='bln'?'on':''}" onclick="mode='bln';draw()">Per bulan</button><button class="${mode==='kum'?'on':''}" onclick="mode='kum';draw()">Kumulatif</button></div>
<label for="mo">${mode==='bln'?'Bulan':'Sampai bulan'}</label><input id="mo" type="month" value="${month}" onchange="month=this.value||month;draw()">
<p class="mut">${mode==='bln'?'Dihitung ulang tiap bulan. Bulan lain bisa dilihat lewat pilihan bulan.':'Pengeluaran dijumlah sejak bulan catatan pertama ('+k+' bulan), anggaran dikalikan '+k+'.'}</p>
<div class="two"><div><div class="mut">Pemasukan</div><b class="pos">${rp(inc)}</b></div><div><div class="mut">Pengeluaran</div><b>${rp(out)}</b></div></div>
<div class="two" style="margin-top:12px"><div><div class="mut">Melebihi anggaran (kategori)</div><b class="neg">${rp(over)}</b></div><div><div class="mut">Anggaran tersisa (kategori)</div><b class="pos">${rp(left)}</b></div></div>
<h2>Kategori: pengeluaran vs anggaran</h2>${bars(cr)}
<h2>Wadah: pengeluaran vs anggaran</h2>${bars(wr)}`}
function opts(list,sel){return list.map(x=>`<option value="${esc(x.id||x)}"${(x.id||x)===sel?' selected':''}>${esc(x.name||x)}</option>`).join('')}
function catat(){
const cats=ttype==='in'?INC:OUT;
return`<div class="seg" role="group" aria-label="Jenis catatan">${[['out','Pengeluaran'],['in','Pemasukan'],['tf','Transfer']].map(([k,l])=>`<button class="${ttype===k?'on':''}" onclick="ttype='${k}';draw()">${l}</button>`).join('')}</div>
<label for="f_date">Tanggal</label><input id="f_date" type="date" value="${new Date().toISOString().slice(0,10)}">
<label for="f_w">${ttype==='in'?'Masuk ke':ttype==='tf'?'Dari':'Dibayar dari'}</label><select id="f_w">${opts(S.wallets)}</select>
${ttype==='tf'?`<label for="f_to">Ke</label><select id="f_to">${opts(S.wallets,S.wallets[1].id)}</select>`:`<label for="f_c">Kategori</label><select id="f_c">${opts(cats)}</select>`}
<label for="f_a">Jumlah (Rp)</label><input id="f_a" type="text" inputmode="numeric" placeholder="0" autocomplete="off" oninput="fm(this)">
<label for="f_n">Catatan (opsional)</label><input id="f_n" type="text">
<button class="btn" onclick="add()">Simpan catatan</button><div id="m" class="msg"></div>
<p class="mut">Saldo awal, nama rekening, dan kategori diatur di tab Atur.</p>`}
function add(){
const amt=P($('f_a').value),w=$('f_w').value,date=$('f_date').value;
if(!(amt>0)||!date){$('m').textContent='Isi tanggal dan jumlah lebih dari 0.';return}
const t={id:Date.now().toString(36),date,type:ttype,wallet:w,amt,note:$('f_n').value.trim()};
if(ttype==='tf'){t.to=$('f_to').value;if(t.to===w){$('m').textContent='Wadah asal dan tujuan harus berbeda.';return}}else t.cat=$('f_c').value;
S.tx.push(t);save();draw();$('m').textContent='Tersimpan.'}
function riw(){
const l=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,100);
if(!l.length)return'<div class="empty">Belum ada catatan. Buka tab Catat untuk menambah.</div>';
return l.map(t=>{const d=t.type==='tf'?`${esc(wn(t.wallet))} ke ${esc(wn(t.to))}`:`${esc(t.cat)} - ${esc(wn(t.wallet))}`;
return`<div class="row"><div><div>${d}</div><div class="mut">${t.date}${t.note?' - '+esc(t.note):''}</div></div><div style="display:flex;align-items:center;gap:4px"><b class="${t.type==='in'?'pos':t.type==='out'?'neg':''}">${t.type==='in'?'+':t.type==='out'?'-':''}${rp(t.amt).replace('-','')}</b><button class="x" aria-label="Hapus catatan" onclick="del('${t.id}')">&times;</button></div></div>`}).join('')}
function del(id){if(!confirm('Hapus catatan ini?'))return;S.tx=S.tx.filter(t=>t.id!==id);save();draw()}
function tgt(){
const now=Date.now();
const cards=S.targets.map(t=>{const cur=t.wallets.reduce((a,id)=>a+bal(id),0);const p=t.amt>0?Math.max(0,Math.min(100,cur/t.amt*100)):0;
const ml=t.deadline?Math.max(.1,(new Date(t.deadline)-now)/2629800000):0;const need=Math.max(0,t.amt-cur);
return`<div class="tg"><div class="row" style="border:0;padding:0"><b>${esc(t.name)}</b><button class="x" aria-label="Hapus target" onclick="delT('${t.id}')">&times;</button></div>
<div class="big">${rp(cur)} <span class="mut" style="font-size:14px;font-weight:400">dari ${rp(t.amt)}</span></div>
<div class="bar"><i style="width:${p}%"></i></div>
<div class="mut">${Math.round(p)}% - dihitung dari ${t.wallets.map(id=>esc(wn(id))).join(', ')||'-'}</div>
${t.deadline?`<div class="mut">Tenggat ${t.deadline}${need>0?` - perlu ${rp(need/ml)} per bulan`:' - tercapai'}</div>`:''}</div>`}).join('')||'<div class="empty">Belum ada target.</div>';
return`${cards}
<h2>Tambah target</h2><label for="t_n">Nama</label><input id="t_n" type="text">
<label for="t_a">Nominal (Rp)</label><input id="t_a" type="text" inputmode="numeric" placeholder="0" autocomplete="off" oninput="fm(this)">
<label for="t_d">Tenggat</label><input id="t_d" type="date">
<label>Dihitung dari wadah</label><div class="chk">${S.wallets.map(w=>`<label><input type="checkbox" class="t_w" value="${w.id}">${esc(w.name)}</label>`).join('')}</div>
<button class="btn" onclick="addT()">Simpan target</button><div id="tm" class="msg"></div>
<h2>Anggaran bulanan per kategori</h2>${OUT.map(c=>`<div class="row"><label for="b_${c}" style="margin:0;color:var(--ink)">${c}</label><input id="b_${c}" type="text" inputmode="numeric" value="${(S.budgets[c]||0).toLocaleString('id-ID')}" style="width:140px" oninput="fm(this)" onchange="S.budgets['${c}']=P(this.value);save()"></div>`).join('')}
<h2>Anggaran bulanan per wadah</h2><p class="mut">Batas total pengeluaran yang keluar dari wadah itu tiap bulan. Isi 0 jika tidak dipakai.</p>${S.wallets.map(w=>`<div class="row"><label for="wb_${w.id}" style="margin:0;color:var(--ink)">${esc(w.name)}</label><input id="wb_${w.id}" type="text" inputmode="numeric" value="${(S.wbud[w.id]||0).toLocaleString('id-ID')}" style="width:140px" oninput="fm(this)" onchange="S.wbud['${w.id}']=P(this.value);save()"></div>`).join('')}
<h2>Cadangan data</h2><p class="mut">Data tersimpan hanya di browser ini. Salin teks cadangan dan simpan di tempat aman.</p>
<textarea id="bk" aria-label="Teks cadangan"></textarea>
<button class="btn alt" onclick="$('bk').value=JSON.stringify(S);$('bk').select()">Tampilkan cadangan</button>
<button class="btn alt" onclick="rest()">Pulihkan dari teks di atas</button><div id="bm" class="msg"></div>`}
function addT(){const n=$('t_n').value.trim(),a=P($('t_a').value),ws=[...document.querySelectorAll('.t_w:checked')].map(x=>x.value);
if(!n||!(a>0)||!ws.length){$('tm').textContent='Isi nama, nominal, dan pilih minimal satu wadah.';return}
S.targets.push({id:Date.now().toString(36),name:n,amt:Math.round(a),wallets:ws,deadline:$('t_d').value});save();draw()}
function delT(id){if(!confirm('Hapus target ini?'))return;S.targets=S.targets.filter(t=>t.id!==id);save();draw()}
function rest(){try{const o=JSON.parse($('bk').value);if(!o.wallets||!o.tx||!o.targets||!o.budgets)throw 0;if(!confirm('Data saat ini akan diganti. Lanjutkan?'))return;S=o;save();draw()}catch(e){$('bm').textContent='Teks cadangan tidak valid.'}}
function sync(){const d=def();['open','wbud','catsOut','catsIn'].forEach(k=>{if(!S[k])S[k]=d[k]});OUT=S.catsOut;INC=S.catsIn}
function nm(v){return String(v).replace(/['"\\<>&]/g,'').trim().slice(0,40)}
function msg(t){draw();const e=$('am');if(e)e.textContent=t}
function atur(){
const rows=(k,L)=>L.map((c,i)=>`<div class="row"><input value="${esc(c)}" aria-label="Nama kategori" onchange="renCat('${k}',${i},this.value)"><button class="x" aria-label="Hapus kategori" onclick="delCat('${k}',${i})">&times;</button></div>`).join('');
const add=(id,ph,fn)=>`<div class="row"><input id="${id}" placeholder="${ph}"><button class="btn alt" style="width:auto;margin:0;white-space:nowrap" onclick="${fn}">Tambah</button></div>`;
return`<p class="mut">Perubahan tersimpan otomatis.</p>
<h2>Saldo awal</h2><p class="mut">Saldo tiap wadah sebelum catatan pertama. Isi sesuai saldo asli hari ini.</p>
${S.wallets.map(w=>`<div class="row"><label for="o_${w.id}" style="margin:0;color:var(--ink)">${esc(w.name)}</label><input id="o_${w.id}" type="text" inputmode="numeric" value="${(S.open[w.id]||0).toLocaleString('id-ID')}" style="width:150px" oninput="fm(this)" onchange="S.open['${w.id}']=P(this.value);save()"></div>`).join('')}
<h2>Rekening dan wadah</h2>
${S.wallets.map(w=>`<div class="row"><input value="${esc(w.name)}" aria-label="Nama wadah" onchange="renW('${w.id}',this.value)"><button class="x" aria-label="Hapus wadah" onclick="delW('${w.id}')">&times;</button></div>`).join('')}
${add('nw','Nama wadah baru','addW()')}
<h2>Kategori pengeluaran</h2>${rows('out',S.catsOut)}${add('nco','Kategori baru','addCat(\'out\')')}
<h2>Kategori pemasukan</h2>${rows('in',S.catsIn)}${add('nci','Kategori baru','addCat(\'in\')')}
<div id="am" class="msg neg"></div>`}
function renW(id,v){v=nm(v);if(v){S.wallets.find(w=>w.id===id).name=v;save()}draw()}
function used(id){return S.tx.some(t=>t.wallet===id||t.to===id)||S.open[id]||S.targets.some(t=>t.wallets.includes(id))}
function delW(id){if(S.wallets.length<3){msg('Minimal harus ada dua wadah.');return}if(used(id)){msg('Wadah ini masih dipakai catatan, saldo awal, atau target, jadi tidak bisa dihapus. Ubah namanya saja.');return}S.wallets=S.wallets.filter(w=>w.id!==id);delete S.wbud[id];save();draw()}
function addW(){const v=nm($('nw').value);if(!v){msg('Isi nama wadah.');return}S.wallets.push({id:'w'+Date.now().toString(36),name:v});save();draw()}
function lst(k){return k==='out'?S.catsOut:S.catsIn}
function renCat(k,i,v){v=nm(v);const L=lst(k),o=L[i];if(!v||(L.includes(v)&&o!==v)){msg('Nama kategori kosong atau sudah ada.');return}L[i]=v;S.tx.forEach(t=>{if(t.cat===o&&t.type===k)t.cat=v});if(k==='out'&&o!==v){S.budgets[v]=S.budgets[o]||0;delete S.budgets[o]}save();draw()}
function delCat(k,i){const L=lst(k),c=L[i];if(L.length<2){msg('Minimal harus ada satu kategori.');return}if(S.tx.some(t=>t.cat===c&&t.type===k)){msg('Kategori ini masih dipakai catatan. Ubah namanya atau hapus catatannya dulu.');return}L.splice(i,1);if(k==='out')delete S.budgets[c];save();draw()}
function addCat(k){const v=nm($(k==='out'?'nco':'nci').value),L=lst(k);if(!v||L.includes(v)){msg('Nama kategori kosong atau sudah ada.');return}L.push(v);if(k==='out')S.budgets[v]=0;save();draw()}
function draw(){sync();
$('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('');
$('v').innerHTML={ring,catat,riw,tgt,atur}[tab]()}
load();draw();
</script>
</body>
</html>
